[project]
name = "primitive-db"
version = "0.1.0"
description = "A console app that imitates a simple database."
readme = "README.md"
authors = [
    { name = "Aleksandr Chalapov", email = "268932756+aleksandrchalapov-cell@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
